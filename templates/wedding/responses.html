{% load static %}
<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Реакциялар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'wedding.css' %}" />
  </head>
  <body>
    <div class="page-shell responses-shell">
      <header class="responses-header">
        <a href="{% url 'home' %}" class="back-link">← Қайту</a>
        <h1>Қатысушылар тізімі</h1>
      </header>

      <div class="responses-table-wrap">
        <table class="responses-table">
          <thead>
            <tr>
              <th>Аты-жөні</th>
              <th>Қатысу</th>
              <th>Жіберілген уақыты</th>
            </tr>
          </thead>
          <tbody>
            {% for item in responses %}
              <tr>
                <td>{{ item.full_name }}</td>
                <td>{{ item.get_attendance_display }}</td>
                <td>{{ item.created_at|date:'d.m.Y H:i' }}</td>
              </tr>
            {% empty %}
              <tr>
                <td colspan="3">Әлі ешкім жауап жіберген жоқ.</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
